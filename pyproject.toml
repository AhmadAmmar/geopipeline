# Purpose: Tell Python build tools how to build and install this package.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Purpose: Describe the Python project itself and define its runtime dependencies.
# Usage: This section is used when the package is installed, including editable installs.
[project]
name = "geopipeline"
version = "0.1.0"
description = "A full-stack geospatial processing platform built step by step."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "GeoPipeline Contributors" }]
dependencies = [
  "fastapi>=0.100,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "geopandas>=1.0,<2.0",
  "shapely>=2.0,<3.0",
  "pyproj>=3.0,<4.0",
  "rasterio>=1.3,<2.0",
  "fiona>=1.9,<2.0",
  "typer>=0.12,<1.0"
]

# Purpose: Keep development-only tooling separate from runtime dependencies.
# Usage: Installed with pip install -e ".[dev]"
[project.optional-dependencies]
dev = [
  "black>=26.0,<27.0",
  "ruff>=0.15,<0.16",
  "mypy>=1.0,<2.0",
  "pytest>=8.0,<9.0",
  "httpx>=0.28,<1.0",
  "pre-commit>=4.0,<5.0"
]

# Purpose: Tell setuptools that our importable Python package lives under backend/src.
# Reason: This is the classic src-layout, which helps catch packaging mistakes early.
[tool.setuptools]
package-dir = { "" = "backend/src" }

# Purpose: Automatically discover Python packages inside backend/src.
[tool.setuptools.packages.find]
where = ["backend/src"]

# Purpose: Configure Black as the single Python formatter for the project.
# Usage: Black will read these settings automatically.
[tool.black]
line-length = 100
target-version = ["py312"]

# Purpose: Configure Ruff as the Python linter and import sorter.
# Usage: Ruff will read this section automatically when run from the repo root.
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "backend/tests"]

# Purpose: Select a practical first-pass ruleset.
# E/F = pycodestyle + pyflakes core issues
# I   = import sorting
# B   = bugbear safety-oriented rules
# UP  = pyupgrade modernization rules
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
fixable = ["ALL"]

# Purpose: Configure mypy with strict typing expectations from the beginning.
# Reason: We want the backend to be typed as a real codebase, not as an afterthought.
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["backend/src", "backend/tests"]

# Purpose: Give pytest a minimal, centralized default configuration.
# Usage: pytest automatically reads this when invoked from the repo root.
[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["backend/tests"]